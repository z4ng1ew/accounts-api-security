# Section 2: build & release integrity. Maps: T1 (signing/provenance), T2 (SBOM), T4 (OIDC scope).
name: build-sign
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: prod-release        # OIDC sub includes environment; AWS trust policy requires it (T4)
    permissions:
      contents: read
      packages: write
      id-token: write                # keyless cosign + AWS OIDC; no stored keys
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - uses: docker/login-action@v3     # local stand-in for ECR (AWS: aws-actions/amazon-ecr-login via OIDC)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: ghcr.io/${{ github.repository }}/accounts-api:${{ github.sha }}
          provenance: mode=max          # SLSA provenance attestation
      - name: Sign by digest (never by tag)
        env:
          IMG: ghcr.io/${{ github.repository }}/accounts-api@${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$IMG"
          syft "$IMG" -o spdx-json > sbom.spdx.json
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMG"
      # Deploy step would update the manifest with the digest (GitOps PR), never a tag.

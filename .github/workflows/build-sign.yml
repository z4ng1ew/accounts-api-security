# Section 2: build & release integrity.
# Threats: T1 (untrusted image), T2 (SBOM for CVE tracking), T4 (pipeline abuse / OIDC scope).
#
# Signing choice: KEYLESS (Sigstore). Trust root = Fulcio CA + Rekor transparency log,
# bound to GitHub's OIDC issuer and this exact workflow path on refs/heads/main.
# Chosen over a KMS key because there is no long-lived key to steal or rotate, and the
# signer identity (repo + workflow + ref) is exactly what the admission policy pins.
#
# WHAT THE SIGNATURE PROVES: this image digest was built by .github/workflows/build-sign.yml
#   running on refs/heads/main of this repo, at a recorded time, with this SBOM attached.
# WHAT IT DOES NOT PROVE: that the code is safe or reviewed (a malicious merge to main is
#   signed just as validly); that the base image/deps are trustworthy; that the image is
#   still free of CVEs today; that the runner wasn't compromised during the build.
#   Those are covered (partially) by CODEOWNERS/branch protection (T4) and Trivy (T2).

name: build-sign
on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPO: accounts-api

jobs:
  build:
    runs-on: ubuntu-latest
    environment: prod-release           # protected env; appears in the OIDC sub claim
    permissions:
      contents: read
      id-token: write                   # OIDC token for AWS + Sigstore; no stored secrets
    steps:
      - uses: actions/checkout@v4

      # CI -> AWS via OIDC. Trust policy: terraform/gha-oidc-trust.json
      # sub = repo:z4ng1ew/accounts-api-security:environment:prod-release
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::111111111111:role/gha-accounts-api-ecr-push
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-${{ github.run_id }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0

      # Immutable, versioned tag: git SHA. The ECR repo has image_tag_mutability = IMMUTABLE
      # (terraform/github_oidc.tf), so pushing an existing tag is rejected by the registry.
      # Deployment references the DIGEST, never the tag (enforced by require-image-digest policy).
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}
          provenance: mode=max

      - name: Sign + attest SBOM (by digest)
        env:
          IMG: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}@${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$IMG"
          syft "$IMG" -o spdx-json > sbom.spdx.json
          # SBOM published as a signed in-toto attestation in the registry, not a build-log artefact
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMG"

      - name: Verify (demonstration; same check Kyverno does at admission)
        env:
          IMG: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}@${{ steps.push.outputs.digest }}
        run: |
          cosign verify "$IMG" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/build-sign.yml@refs/heads/main"
          cosign verify-attestation "$IMG" --type spdxjson \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/build-sign.yml@refs/heads/main"

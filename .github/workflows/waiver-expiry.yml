# Daily: an expired waiver must re-break visibly, not wait for the next PR.
name: waiver-expiry
on:
  schedule: [{ cron: "17 5 * * *" }]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyyaml
      - id: v
        run: python security/scripts/check_waivers.py validate security/waivers/waivers.yaml > out.txt 2>&1 || echo "failed=true" >> "$GITHUB_OUTPUT"
      - if: steps.v.outputs.failed == 'true'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh issue create --title "Expired/invalid security waiver" --label security --body-file out.txt

# Section 6: database credential delivery — source of truth to running process. No plaintext anywhere
# in git: the only things committed are references (ARNs / secret names).
#
# PATH (production, AWS):
#   [1] AWS Secrets Manager  prod/accounts-api/db      (source of truth; KMS CMK alias/accounts-api;
#        |                                              rotated by Secrets Manager rotation Lambda)
#        |  GetSecretValue over VPC interface endpoint, authenticated with IRSA
#   [2] External Secrets Operator (namespace external-secrets, platform-owned)
#        |  uses THIS namespace's SecretStore, which impersonates SA `accounts-api-secrets-reader`
#        |  (IRSA role scoped to prod/accounts-api/* only) — ESO itself holds no AWS rights
#   [3] Kubernetes Secret `accounts-api-db`  (etcd encrypted with EKS KMS envelope encryption)
#        |  mounted as FILES (not env vars): kubelet refreshes the files ~60s after the Secret changes,
#        |  env vars would be frozen until restart and leak via /proc/<pid>/environ and crash dumps
#   [4] accounts-api process reads /var/run/secrets/db/{username,password} on connect and on any
#       auth failure (reconnect with fresh credential); never logs them.
#
# Local equivalent for this exercise: ESO's `fake` provider (not committed) or LocalStack; mapping only.
# Assumption: the app uses a dedicated DB user `accounts_app` (DML only), NOT the RDS master user —
# the master password is RDS-managed (manage_master_user_password) and never leaves Secrets Manager.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: accounts-api-secrets-reader
  namespace: accounts
  annotations:
    # IRSA role: secretsmanager:GetSecretValue on prod/accounts-api/db-?????? and /kyc-?????? only,
    # kms:Decrypt via secretsmanager only (see review/iam/accounts-api-pod-role.json)
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/accounts-api-secrets-reader
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore                       # namespaced, not ClusterSecretStore: other teams can't point at it
metadata:
  name: aws-sm
  namespace: accounts
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef: { name: accounts-api-secrets-reader }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: accounts-api-db
  namespace: accounts
spec:
  refreshInterval: 5m                   # max lag between rotation and the pod seeing it (+~60s kubelet)
  secretStoreRef: { kind: SecretStore, name: aws-sm }
  target:
    name: accounts-api-db
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        annotations: { reloader.stakater.com/match: "true" }   # optional rolling restart on change
  data:
    - secretKey: username
      remoteRef: { key: prod/accounts-api/db, property: username }
    - secretKey: password
      remoteRef: { key: prod/accounts-api/db, property: password }
    - secretKey: host
      remoteRef: { key: prod/accounts-api/db, property: host }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: accounts-api-kyc
  namespace: accounts
spec:
  refreshInterval: 5m
  secretStoreRef: { kind: SecretStore, name: aws-sm }
  target: { name: accounts-api-kyc, creationPolicy: Owner }
  data:
    - secretKey: api_key
      remoteRef: { key: prod/accounts-api/kyc, property: api_key }
---
# Only the ESO controller may read these Secrets; the app reads them via the kubelet volume mount and
# has no RBAC on secrets at all (enforced by policies/kyverno/restrict-rbac.yaml).
# Deployment excerpt (full manifest: review/workload/after.yaml / k8s/fixed/deployment.yaml):
apiVersion: apps/v1
kind: Deployment
metadata: { name: accounts-api, namespace: accounts }
spec:
  selector: { matchLabels: { app: accounts-api } }
  template:
    metadata: { labels: { app: accounts-api } }
    spec:
      serviceAccountName: accounts-api
      automountServiceAccountToken: false
      containers:
        - name: api
          image: 123456789012.dkr.ecr.ap-south-1.amazonaws.com/accounts-api@sha256:4f2b9d0e3c1a8b7f6e5d4c3b2a1908f7e6d5c4b3a29180f7e6d5c4b3a2918070
          env:
            - { name: DB_CREDENTIALS_DIR, value: /var/run/secrets/db }
            - { name: KYC_KEY_FILE, value: /var/run/secrets/kyc/api_key }
          volumeMounts:
            - { name: db-creds, mountPath: /var/run/secrets/db, readOnly: true }
            - { name: kyc-creds, mountPath: /var/run/secrets/kyc, readOnly: true }
      volumes:
        - name: db-creds
          secret: { secretName: accounts-api-db, defaultMode: 0400 }
        - name: kyc-creds
          secret: { secretName: accounts-api-kyc, defaultMode: 0400 }
#
# ENCRYPTION (one line): data at rest in RDS, its snapshots, Secrets Manager and EKS etcd is encrypted
# with customer-managed KMS keys in the prod account (key policy: only the service roles may decrypt,
# key admins cannot) — this addresses theft of snapshots/backups/storage and cross-account snapshot
# sharing, NOT an attacker inside the running pod, who sees plaintext like the app does.

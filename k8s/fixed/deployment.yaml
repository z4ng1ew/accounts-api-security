apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounts-api
  namespace: accounts
spec:
  replicas: 2
  selector: { matchLabels: { app: accounts-api } }
  template:
    metadata: { labels: { app: accounts-api } }
    spec:
      serviceAccountName: accounts-api              # IRSA, no static keys (T7)
      automountServiceAccountToken: true            # needed for IRSA projected token only
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: ghcr.io/example/accounts-api@sha256:1111111111111111111111111111111111111111111111111111111111111111
          ports: [{ containerPort: 8080 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities: { drop: [ALL] }
          envFrom:
            - secretRef: { name: accounts-api-db }  # synced by External Secrets from Secrets Manager (T7)
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }

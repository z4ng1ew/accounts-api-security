# T6/T9: default-deny; ingress only from ALB controller-managed pods/ingress ns; egress only DNS, RDS, KYC.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny, namespace: accounts }
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: accounts-api, namespace: accounts }
spec:
  podSelector: { matchLabels: { app: accounts-api } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - ipBlock: { cidr: 10.0.0.0/16 }        # ALB subnets (assumption: target-type ip)
      ports: [{ port: 8080 }]
  egress:
    - to: [{ namespaceSelector: {}, podSelector: { matchLabels: { k8s-app: kube-dns } } }]
      ports: [{ port: 53, protocol: UDP }]
    - to: [{ ipBlock: { cidr: 10.0.64.0/20 } }]  # RDS subnets
      ports: [{ port: 5432 }]
    - to: [{ ipBlock: { cidr: 0.0.0.0/0, except: [10.0.0.0/8, 169.254.169.254/32] } }]
      ports: [{ port: 443 }]
      # LIMITATION: L3/L4 NetworkPolicy cannot pin a hostname. Pinning to the KYC
      # host needs an FQDN-aware policy (Cilium) or egress proxy — see DECISIONS.md D6.

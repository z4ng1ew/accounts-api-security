apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: accounts-api-db, namespace: accounts }
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: SecretStore, name: aws-sm }
  target: { name: accounts-api-db }
  data:
    - secretKey: DB_PASSWORD
      remoteRef: { key: prod/accounts-api/db, property: password }
    - secretKey: KYC_API_KEY
      remoteRef: { key: prod/accounts-api/kyc, property: api_key }

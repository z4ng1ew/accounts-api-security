# Not a named threat: shared-cluster availability (noisy neighbour). Built because 12 teams share nodes.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata: { name: require-resources }
spec:
  # ROLLOUT — day one: Audit cluster-wide; Enforce in labelled namespaces (accounts on day one)
  # PROMOTION TO ENFORCE: Same label promotion. Lowest priority: availability, not a named threat; never blocks promotion of the others.
  validationFailureAction: Audit
  validationFailureActionOverrides:
    - action: Enforce
      namespaces: ["*"]
      namespaceSelector:
        matchLabels: { policy.bank/enforce: "true" }
  background: true
  rules:
    - name: memory-limit-and-cpu-request
      match: { any: [{ resources: { kinds: [Pod] } }] }
      validate:
        message: "Containers need a memory limit and a CPU request."
        pattern:
          spec:
            containers:
              - resources:
                  requests: { cpu: "?*" }
                  limits: { memory: "?*" }

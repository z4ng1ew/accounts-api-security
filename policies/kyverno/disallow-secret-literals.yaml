# T3/T7: secrets must come from secretRef (External Secrets), never literal env values.
# LIMITATION: name-based heuristic. A secret in an innocuously named var passes; Gitleaks in CI is the backstop.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata: { name: disallow-secret-literals }
spec:
  # ROLLOUT — day one: Audit cluster-wide; Enforce in labelled namespaces (accounts on day one)
  # PROMOTION TO ENFORCE: Same label promotion. Name-based heuristic, so expect a few false positives (e.g. TOKEN_TTL=3600); those are fixed by renaming or a PolicyException before promotion.
  validationFailureAction: Audit
  validationFailureActionOverrides:
    - action: Enforce
      namespaces: ["*"]
      namespaceSelector:
        matchLabels: { policy.bank/enforce: "true" }
  background: true
  rules:
    - name: no-literal-secret-env
      match: { any: [{ resources: { kinds: [Pod] } }] }
      validate:
        message: "Env vars that look like secrets must use valueFrom.secretKeyRef (T3)."
        foreach:
          - list: "request.object.spec.containers[].env[]"
            deny:
              conditions:
                all:
                  - key: "{{ regex_match('(?i)(PASSWORD|SECRET|TOKEN|API_KEY|ACCESS_KEY)', '{{ element.name }}') }}"
                    operator: Equals
                    value: true
                  - key: "{{ element.value || '' }}"
                    operator: NotEquals
                    value: ""
